name: Wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish PyPI and create the matching GitHub Release
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x86_64
            macos-deployment-target: ""
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            macos-deployment-target: ""
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            macos-deployment-target: "10.15"
          - runner: macos-15
            platform: macos
            arch: arm64
            macos-deployment-target: "11.0"
          - runner: windows-latest
            platform: windows
            arch: AMD64
            macos-deployment-target: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up build driver
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==4.1.1"

      - name: Set macOS deployment target
        if: matrix.platform == 'macos'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-deployment-target }}" >> "$GITHUB_ENV"

      - name: Build and test repaired wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  source:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: source-dist
          path: dist/*.tar.gz
          if-no-files-found: error

  package:
    name: Prepare release artifacts
    needs: [wheels, source]
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Verify tag and artifact versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib
          import os

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              print(f"non-release ref {tag}; preparing artifacts without tag publication")
              raise SystemExit(0)
          expected = tag[1:]
          with pathlib.Path("pyproject.toml").open("rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          if version != expected:
              raise SystemExit(f"tag {expected} does not match project version {version}")

          artifacts = sorted(pathlib.Path("dist").iterdir())
          if not artifacts:
              raise SystemExit("no release artifacts were downloaded")
          pattern = re.compile(rf"(?:^|[-_]){re.escape(expected)}(?:[-_.]|$)")
          for artifact in artifacts:
              if artifact.suffix not in {".whl", ".gz"} or not pattern.search(artifact.name):
                  raise SystemExit(f"unexpected release artifact: {artifact.name}")
          if not any(item.name.endswith(".tar.gz") for item in artifacts):
              raise SystemExit("source distribution is missing")
          if not any(item.name.endswith(".whl") for item in artifacts):
              raise SystemExit("wheel artifacts are missing")
          PY

      - name: Validate distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish PyPI and GitHub Release
    needs: package
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish == true &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download prepared release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Create GitHub Release from the published artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eqmdsk ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
