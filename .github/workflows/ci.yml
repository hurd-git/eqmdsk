name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install from source
        run: python -m pip install --upgrade ".[test]"

      - name: Run Python tests
        run: python -m pytest

  typing:
    name: Python 3.9 type surface
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip

      - name: Install package and type checker
        run: >-
          python -m pip install --upgrade ".[typecheck]"
          "mypy<2" "numpy<2.1"

      - name: Check documented Python usage
        run: python -m mypy --python-version 3.9 tests/typing/check_usage.py

      - name: Compare stubs with the extension module
        run: >-
          python -m mypy.stubtest eqmdsk
          --allowlist tests/typing/stubtest_allowlist.txt

  cpp:
    name: C++ Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure C++ tests
        run: >-
          cmake -S . -B build/cpp
          -DCMAKE_BUILD_TYPE=Release
          -DEQMDSK_BUILD_PYTHON=OFF
          -DEQMDSK_BUILD_TESTS=ON
          -DEQMDSK_FETCH_DEPENDENCIES=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON

      - name: Build C++ tests
        run: cmake --build build/cpp --config Release --parallel 2

      - name: Run C++ tests
        run: ctest --test-dir build/cpp -C Release --output-on-failure

      - name: Install Eigen for the standalone consumer
        run: >-
          cmake -S build/cpp/_deps/eqmdsk_eigen-src -B build/eigen
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/prefix
          -DBUILD_TESTING=OFF
          -DEIGEN_BUILD_TESTING=OFF
          -DEIGEN_BUILD_DOC=OFF
          -DEIGEN_BUILD_BLAS=OFF
          -DEIGEN_BUILD_LAPACK=OFF

      - name: Install Eigen
        run: cmake --build build/eigen --config Release --target install --parallel 2

      - name: Install the eqmdsk C++ SDK
        run: >-
          cmake --install build/cpp --config Release
          --prefix ${{ github.workspace }}/build/prefix
          --component Development

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/consumer -B build/consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/prefix

      - name: Build installed-package consumer
        run: cmake --build build/consumer --config Release --parallel 2

      - name: Run installed-package consumer
        run: ctest --test-dir build/consumer -C Release --output-on-failure

  public-compatibility:
    name: Pinned public G/A corpus
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install from source
        run: python -m pip install --upgrade ".[test]"

      - name: Fetch checksum-pinned public fixtures
        run: python tests/public_data/fetch.py --output build/public-data

      - name: Run public compatibility tests
        env:
          EQMDSK_PUBLIC_FIXTURE_DIR: ${{ github.workspace }}/build/public-data
        run: python -m pytest tests/python/test_public_fixtures.py

  distributions:
    name: Source and wheel distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify distribution contents
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          sdist, = dist.glob("*.tar.gz")
          wheel, = dist.glob("*.whl")

          with tarfile.open(sdist, "r:gz") as archive:
              source_names = archive.getnames()
          with zipfile.ZipFile(wheel) as archive:
              wheel_names = archive.namelist()

          required_source = (
              "LICENSE",
              "README.md",
              "THIRD_PARTY_NOTICES.md",
              "licenses/eigen/COPYING.MPL2",
              "licenses/pybind11/LICENSE",
              "pyproject.toml",
              "python/eqmdsk/__init__.pyi",
              "python/eqmdsk/py.typed",
          )
          for name in required_source:
              assert any(item.endswith("/" + name) for item in source_names), name
          assert not any("/extern/" in item for item in source_names)
          assert not any("/.venv/" in item for item in source_names)
          assert any(item.endswith("/eqmdsk/__init__.py") for item in wheel_names)
          assert any(item.endswith("/eqmdsk/__init__.pyi") for item in wheel_names)
          assert any(item.endswith("/eqmdsk/py.typed") for item in wheel_names)
          assert any("eqmdsk/_core" in item for item in wheel_names)
          assert any(item.endswith("/LICENSE") for item in wheel_names)
          assert any(item.endswith("/THIRD_PARTY_NOTICES.md") for item in wheel_names)
          assert any(item.endswith("/licenses/eigen/COPYING.MPL2") for item in wheel_names)
          assert not any("include/eqmdsk" in item for item in wheel_names)
          assert not any(item.endswith((".a", ".lib", ".cmake")) for item in wheel_names)
          PY

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          python -m venv build/wheel-venv
          build/wheel-venv/bin/python -m pip install --upgrade dist/*.whl "pytest>=8" mypy
          build/wheel-venv/bin/python -c "import eqmdsk; assert eqmdsk.__version__ == '0.9.0'"
          build/wheel-venv/bin/python -m pytest tests/python
          build/wheel-venv/bin/python -m mypy --strict --python-version 3.12 tests/typing/check_usage.py
          build/wheel-venv/bin/python -m mypy.stubtest eqmdsk --allowlist tests/typing/stubtest_allowlist.txt

      - name: Rebuild a wheel from the source distribution
        shell: bash
        run: |
          mkdir -p build/sdist-source build/sdist-wheel
          tar -xzf dist/*.tar.gz -C build/sdist-source
          python -m build --wheel --outdir build/sdist-wheel build/sdist-source/eqmdsk-0.9.0
          python -m venv build/sdist-wheel-venv
          build/sdist-wheel-venv/bin/python -m pip install --upgrade build/sdist-wheel/*.whl
          build/sdist-wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          import eqmdsk

          package = Path(eqmdsk.__file__).parent
          assert eqmdsk.__version__ == "0.9.0"
          assert (package / "__init__.pyi").is_file()
          assert (package / "py.typed").is_file()
          PY
