[build-system]
requires = [
  "scikit-build-core>=1.0",
  "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "eqmdsk"
version = "0.9.0"
description = "Lightweight, compatible EFIT G/A/K/S file I/O for C++ and Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/**/*"]
authors = [{ name = "eqmdsk contributors" }]
keywords = ["EFIT", "equilibrium", "GEQDSK", "EQDSK"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
    "ipykernel>=6.31.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
test = ["pytest>=8"]
typecheck = ["mypy>=1.11"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = [
  "-DEQMDSK_BUILD_TESTS=OFF",
  "-DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF",
]
install.components = ["Python"]
wheel.packages = ["python/eqmdsk"]
sdist.exclude = [
  ".venv",
  "extern",
  "build",
  "dist",
  ".pytest_cache",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]

[tool.mypy]
# Public documentation lives in __init__.py; __init__.pyi contains only type
# declarations. CI also runs a separately constrained Python 3.9 mypy check.
python_version = "3.12"
strict = true
files = ["tests/typing/check_usage.py"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32"
environment = { CMAKE_ARGS = "-DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON" }
test-requires = ["pytest>=8"]
test-command = "python -m pytest {project}/tests/python"
